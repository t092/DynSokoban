<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>朝代關卡遊戲 · 學習作業</title>
<script src="cai-service.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2a2420;
    color: #eee9df;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 24px 16px;
  }
  h1 { font-size: 26px; letter-spacing: 6px; margin-bottom: 6px; color: #e8ddc9; }
  .sub { font-size: 14px; color: #b9a98c; letter-spacing: 2px; margin-bottom: 14px; text-align: center; }
  
  .hud {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    justify-content: center; margin-bottom: 16px; font-size: 14px;
    background: rgba(30, 26, 22, 0.7); padding: 10px 18px;
    border-radius: 10px; border: 1px solid #4a3e32;
  }
  .hud b { color: #e0b46a; }
  .student-tag {
    background: #3c342c; padding: 4px 10px; border-radius: 6px;
    border: 1px solid #5d4d3c; color: #e0cfA8; font-weight: bold;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tag-guest { background: #5b718b; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
  
  button {
    background: #9d5945; color: #fff; border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 13px; letter-spacing: 1px; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  button:hover { background: #b06a52; }
  .btn-sec { background: #4a3e32; }
  .btn-sec:hover { background: #5e4f40; }
  .btn-gold { background: #a8784b; }
  .btn-gold:hover { background: #bd8a58; }

  #board {
    display: grid; gap: 4px; padding: 14px;
    background: #1e1a16; border-radius: 12px;
    border: 2px solid #54483a; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .cell {
    width: var(--cell-size, 64px); height: 64px; border-radius: 8px;
    background: #332c25;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: bold; text-align: center; line-height: 1.2;
    transition: background .15s;
  }
  .wall  { background: #201a15; box-shadow: inset 0 0 0 1px #453a2d; }
  .floor { background: #3a332a; }
  .hint {
    background: #594f40; color: #e0cfA8; box-shadow: inset 0 0 0 2px #8d7a58;
    font-size: 14px; letter-spacing: 1px;
  }
  .wide-hint { grid-column: span 2; width: auto; min-width: 0; }
  #board.final-board .cell { font-size: 12px; }
  .target {
    background: #3a332a;
    box-shadow: inset 0 0 0 3px #c9a15a, inset 0 0 18px rgba(224,180,106,.35);
  }
  .block-a { background: #b07b4d; color: #fff; box-shadow: 0 4px 0 #7c5535; }
  .block-b { background: #5b718b; color: #fff; box-shadow: 0 4px 0 #3d4d61; }
  .block-c { background: #9b493d; color: #fff; box-shadow: 0 4px 0 #693128; }
  .block-d { background: #536c6a; color: #fff; box-shadow: 0 4px 0 #354644; }
  .block-e { background: #a34e3f; color: #fff; box-shadow: 0 4px 0 #71372d; }
  .block-f { background: #a8784b; color: #fff; box-shadow: 0 4px 0 #76552f; }
  .block-g { background: #80644c; color: #fff; box-shadow: 0 4px 0 #5d4938; }
  .block-h { background: #617b78; color: #fff; box-shadow: 0 4px 0 #405653; }
  .block.done { box-shadow: 0 4px 0 rgba(0,0,0,.35), inset 0 0 0 3px #7ec488; }
  .player {
    background: #e0b46a !important; color: #333;
    border-radius: 50%; font-size: 30px;
    box-shadow: 0 0 14px rgba(224,180,106,.6);
  }
  .door { position: relative; overflow: hidden; }
  .door::after { content: ""; position: absolute; inset: 0; background: #201a15; transition: transform .8s ease; }
  .door.open::after { transform: translateY(-100%); }
  .celebrate { animation: celebrate .6s ease-in-out infinite alternate; }
  @keyframes celebrate { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-8px) rotate(2deg); } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i { position: absolute; top: -20px; width: 9px; height: 16px; animation: fall 1.8s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  
  #msg { margin-top: 14px; font-size: 16px; letter-spacing: 2px; color: #7ec488; min-height: 24px; text-align: center; }
  .help { margin-top: 10px; font-size: 13px; color: #8d7f6a; letter-spacing: 1px; }

  /* 隱藏關：限時連號消消樂 */
  .sequence-game { display: none; width: min(94vw, 680px); margin-top: 8px; }
  .sequence-game.active { display: block; }
  .sequence-intro {
    margin: 0 auto 14px; padding: 16px 20px; border: 1px solid #8d7a58;
    border-radius: 14px; background: linear-gradient(135deg, #3d3025, #241d18);
    text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,.28);
  }
  .sequence-intro h2 { color: #e0b46a; letter-spacing: 3px; font-size: 22px; }
  .sequence-intro p { color: #cbbda5; margin-top: 7px; font-size: 14px; }
  .sequence-hud {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    margin-bottom: 12px; padding: 10px 14px; border: 1px solid #6b5439;
    border-radius: 10px; background: #211a15; color: #cbbda5; font-size: 14px;
  }
  .sequence-hud b { color: #f2c66d; font-size: 21px; }
  .sequence-hud .timer { color: #ef9a62; }
  .sequence-hud .timer.urgent { color: #ff625a; animation: timerPulse .45s ease-in-out infinite alternate; }
  @keyframes timerPulse { to { transform: scale(1.12); } }
  #sequenceBoard {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; padding: 10px;
    border: 2px solid #685038; border-radius: 14px; background: #17120f;
    box-shadow: 0 16px 40px rgba(0,0,0,.52);
  }
  .sequence-tile {
    aspect-ratio: 1; min-width: 0; border: 0; border-radius: 9px; padding: 2px;
    color: #fff; font: bold clamp(11px, 2.5vw, 16px)/1.15 inherit;
    cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.26), 0 2px 0 rgba(0,0,0,.3);
    transition: transform .12s, filter .12s, outline .12s;
  }
  .sequence-tile:hover { filter: brightness(1.14); transform: translateY(-2px); }
  .sequence-tile.selected { outline: 3px solid #f4cf75; outline-offset: 2px; transform: scale(.94); }
  .sequence-tile.clearing { animation: tileClear .24s ease forwards; }
  @keyframes tileClear { to { opacity: 0; transform: scale(.2) rotate(12deg); } }
  .sequence-result { min-height: 25px; margin-top: 12px; text-align: center; color: #e0b46a; letter-spacing: 1px; }
  .sequence-mode .classic-only, .sequence-mode #board, .sequence-mode #msg, .sequence-mode .help { display: none; }
  @media (max-width: 520px) {
    .sequence-game { width: 96vw; }
    .sequence-hud { padding: 8px 9px; font-size: 12px; }
    .sequence-hud b { font-size: 18px; }
    #sequenceBoard { gap: 3px; padding: 7px; }
  }

  /* 彈窗樣式 */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20, 16, 12, 0.78);
  }
  .modal.hidden { display: none; }
  .modal-box {
    background: #2e2820; border: 2px solid #c9a15a;
    border-radius: 16px; padding: 32px 48px; text-align: center;
    box-shadow: 0 18px 60px rgba(0,0,0,.7); max-width: 480px; width: 90%;
    animation: pop .3s ease-out;
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box h2 { color: #e0b46a; letter-spacing: 4px; margin-bottom: 12px; font-size: 26px; }
  .modal-box p { color: #eee9df; font-size: 16px; letter-spacing: 1px; margin: 8px 0; line-height: 1.6; }
  .modal-box .small { color: #b9a98c; font-size: 13px; margin-top: 16px; }

  }
  .rank-table th {
    background: #3d3429; color: #e0b46a; padding: 8px;
    border-bottom: 2px solid #54483a; letter-spacing: 1px;
  }
  .rank-table td {
    padding: 8px; border-bottom: 1px solid #44382d; color: #eee9df;
  }
  .rank-table tr:nth-child(1) td:first-child { color: #f1c40f; font-weight: bold; }
  .rank-table tr:nth-child(2) td:first-child { color: #bdc3c7; font-weight: bold; }
  .rank-table tr:nth-child(3) td:first-child { color: #e67e22; font-weight: bold; }
  .rank-badge { font-size: 15px; }
</style>

<script>
const WALL = '#', FLOOR = '.';
const ROWS = 9, COLS = 12;

// ---- 學生學籍身分初始化 ----
let currentStudent = CAI.getStudent();
if (!currentStudent) {
  // 未登入直接進入本頁面時，預設給予訪客體驗身分
  currentStudent = CAI.setGuestMode();
}

function updateStudentHud() {
  const badge = document.getElementById('hudStudentBadge');
  if (currentStudent.isGuest) {
    badge.innerHTML = '👤 體驗模式 <span class="tag-guest">不計成績</span>';
  } else if (currentStudent.isTeacher) {
    badge.innerHTML = '👤 教師測試模式';
  } else {
    badge.innerHTML = `👤 ${currentStudent.classId}班 ${currentStudent.seatNo}號 ${currentStudent.name}`;
  }
}

function exitToHome() {
  window.location.href = 'index.html';
}

// ---- 音效系統 ----
let audioCtx = null;
let soundOn = true;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, duration, type, gain, delay, slideTo) {
  if (!soundOn) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const start = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const vol = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, start);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + duration);
  vol.gain.setValueAtTime(0.0001, start);
  vol.gain.exponentialRampToValueAtTime(gain || 0.05, start + 0.012);
  vol.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(vol).connect(ctx.destination);
  osc.start(start);
  osc.stop(start + duration + 0.05);
}

function sfxStep() { tone(340, 0.06, 'triangle', 0.03); }
function sfxPush() { tone(150, 0.16, 'square', 0.04, 0, 92); }
function sfxBlocked() { tone(95, 0.09, 'sawtooth', 0.028); }
function sfxPlace() { tone(660, 0.11, 'sine', 0.055); tone(990, 0.16, 'sine', 0.04, 0.075); }
function sfxDoor() { tone(190, 0.5, 'sine', 0.045, 0, 560); }
function sfxWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.34, 'sine', 0.065, i * 0.12)); }
function sfxFinal() {
  [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => tone(f, 0.5, 'sine', 0.07, i * 0.14));
  tone(261.63, 1.5, 'triangle', 0.045, 0.12);
}
function sfxReset() { tone(300, 0.14, 'sine', 0.04, 0, 180); }
function sfxNext() { tone(440, 0.16, 'sine', 0.05); tone(587.33, 0.24, 'sine', 0.05, 0.1); }

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundToggle').textContent = soundOn ? '音效：開' : '音效：關';
  if (soundOn) sfxPlace();
}

// ---- 背景音樂 ----
const MUSIC_VOLUME = 0.12;
let musicOn = true;
let musicStarted = false;
const bgm = () => document.getElementById('bgm');

function toggleMusic() {
  musicOn = !musicOn;
  const audio = bgm();
  if (musicOn) {
    audio.volume = MUSIC_VOLUME;
    audio.play().catch(() => {});
    document.getElementById('musicToggle').textContent = '音樂：開';
  } else {
    audio.pause();
    document.getElementById('musicToggle').textContent = '音樂：關';
  }
}

function ensureMusic() {
  if (musicOn && !musicStarted) {
    const audio = bgm();
    if (!audio) return;
    audio.volume = MUSIC_VOLUME;
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        musicStarted = true;
      }).catch(() => {
        const unlock = () => {
          if (!musicStarted && musicOn) {
            audio.play().then(() => { musicStarted = true; }).catch(() => {});
          }
          ['pointerdown', 'mousemove', 'touchstart', 'keydown'].forEach(evt => {
            window.removeEventListener(evt, unlock);
          });
        };
        ['pointerdown', 'mousemove', 'touchstart', 'keydown'].forEach(evt => {
          window.addEventListener(evt, unlock, { once: true, passive: true });
        });
      });
    }
  }
}

// ---- 關卡建置 ----
function buildLevel() {
  const level = [];
  const columns = boardCols();
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < columns; c++) {
      row.push(r === 0 || r === ROWS - 1 || c === 0 || c === columns - 1 ? WALL : FLOOR);
    }
    level.push(row);
  }
  if (levelNumber === 3) return markSpanCells(buildThirdLevel(level));
  if (levelNumber === 2) return markSpanCells(buildSecondLevel(level));
  if (levelNumber === 5) return markSpanCells(buildFinalLevel(level));
  if (levelNumber === 4) return markSpanCells(buildFourthLevel(level));
  level[1][2] = { hint: '商' };
  level[1][4] = { hint: '五　代' };
  level[1][7] = { hint: '中華民國' };
  level[0][6] = { door: true };
  return markSpanCells(level);
}

function markSpanCells(level) {
  for (let r = 0; r < level.length; r++) {
    for (let c = 0; c < level[r].length; c++) {
      const cell = level[r][c];
      if (!cell || !cell.span) continue;
      for (let offset = 1; offset < cell.span; offset++) {
        level[r][c + offset] = { spanPart: true };
      }
    }
  }
  return level;
}

function buildSecondLevel(level) {
  level[3][1] = { hint: '商' };
  level[3][3] = { hint: '東周', span: 2 };
  level[3][6] = { hint: '漢' };
  return level;
}

function buildThirdLevel(level) {
  level[1][1] = { hint: '秦' };
  level[1][2] = { hint: '漢', span: 3 };
  level[1][5] = { hint: '魏晉南北朝', span: 4 };
  level[1][10] = { hint: '唐' };
  level[2][3] = { hint: '新' };
  level[2][7] = { hint: '五胡十六國' };
  return level;
}

function buildFourthLevel(level) {
  level[1][2] = { hint: '五代十國' };
  level[1][6] = { hint: '明清', span: 2 };
  return level;
}

function buildFinalLevel(level) {
  level[1][1] = { hint: '商' };
  level[1][18] = { hint: '中華民國' };
  return level;
}

const START_BLOCKS = [
  { name: '周到隋唐', cls: 'block-a', tr: 1, tc: 3 },
  { name: '宋元',     cls: 'block-b', tr: 1, tc: 5 },
  { name: '明清',     cls: 'block-c', tr: 1, tc: 6 },
];
const PLAYER_START = { r: 7, c: 5 };
const SECOND_BLOCKS = [
  { name: '西周', cls: 'block-a', tr: 3, tc: 2 },
  { name: '春秋', cls: 'block-b', tr: 4, tc: 3 },
  { name: '戰國', cls: 'block-c', tr: 4, tc: 4 },
  { name: '秦', cls: 'block-d', tr: 3, tc: 5 },
];
const SECOND_SPAWN_CELLS = [
  { r: 5, c: 2 }, { r: 5, c: 4 }, { r: 5, c: 6 }, { r: 5, c: 8 },
  { r: 6, c: 3 }, { r: 6, c: 5 }, { r: 6, c: 7 }, { r: 6, c: 9 },
];
const THIRD_BLOCKS = [
  { name: '西漢', cls: 'block-a', tr: 2, tc: 2 },
  { name: '東漢', cls: 'block-c', tr: 2, tc: 4 },
  { name: '三國', cls: 'block-d', tr: 2, tc: 5 },
  { name: '西晉', cls: 'block-e', tr: 2, tc: 6 },
  { name: '南北朝', cls: 'block-f', tr: 2, tc: 8 },
  { name: '東晉', cls: 'block-g', tr: 3, tc: 7 },
  { name: '隋', cls: 'block-h', tr: 1, tc: 9 },
];
const THIRD_SPAWN_CELLS = [
  { r: 4, c: 2 }, { r: 4, c: 4 }, { r: 4, c: 6 }, { r: 4, c: 8 },
  { r: 5, c: 3 }, { r: 5, c: 5 }, { r: 5, c: 7 }, { r: 5, c: 9 },
  { r: 6, c: 2 }, { r: 6, c: 4 }, { r: 6, c: 8 }, { r: 6, c: 9 },
];
const FOURTH_BLOCKS = [
  { name: '唐', cls: 'block-h', tr: 1, tc: 1 },
  { name: '遼', cls: 'block-a', tr: 1, tc: 3 },
  { name: '北宋', cls: 'block-b', tr: 2, tc: 3 },
  { name: '金', cls: 'block-c', tr: 1, tc: 4 },
  { name: '南宋', cls: 'block-d', tr: 2, tc: 4 },
  { name: '元', cls: 'block-e', tr: 1, tc: 5 },
];
const FOURTH_SPAWN_CELLS = [
  { r: 3, c: 2 }, { r: 3, c: 4 }, { r: 3, c: 6 }, { r: 3, c: 8 },
  { r: 4, c: 3 }, { r: 4, c: 5 }, { r: 4, c: 7 }, { r: 4, c: 9 },
  { r: 5, c: 2 }, { r: 5, c: 4 }, { r: 5, c: 6 }, { r: 5, c: 8 },
  { r: 6, c: 3 }, { r: 6, c: 5 }, { r: 6, c: 7 }, { r: 6, c: 9 },
];
const SPAWN_CELLS = [
  { r: 3, c: 2 }, { r: 3, c: 4 }, { r: 3, c: 6 }, { r: 3, c: 8 },
  { r: 4, c: 3 }, { r: 4, c: 5 }, { r: 4, c: 7 }, { r: 4, c: 9 },
  { r: 5, c: 2 }, { r: 5, c: 4 }, { r: 5, c: 6 }, { r: 5, c: 8 },
  { r: 6, c: 3 }, { r: 6, c: 5 }, { r: 6, c: 7 }, { r: 6, c: 9 },
];
const FINAL_BLOCKS = [

const SEQUENCE_TIME_LIMIT = 30;

function boardCols() { return levelNumber === 5 ? 20 : COLS; }

function isWallCell(r, c) {
  const cell = level[r][c];
  return cell === WALL || (typeof cell === 'object' && cell !== null);
}
function blockAt(r, c) { return blocks.find(b => b.r === r && b.c === c); }
function isTarget(b, r, c) { return b.tr === r && b.tc === c; }

function updateHud() {

function loadLevel() {
  level = buildLevel();
  const blockSet = levelNumber === 5
    ? FINAL_BLOCKS
    : levelNumber === 4
      ? FOURTH_BLOCKS
      : levelNumber === 3
      ? THIRD_BLOCKS
      : levelNumber === 2 ? SECOND_BLOCKS : START_BLOCKS;
  const spawnSet = levelNumber === 5
    ? FINAL_SPAWN_CELLS
    : levelNumber === 4
      ? FOURTH_SPAWN_CELLS
      : levelNumber === 3
      ? THIRD_SPAWN_CELLS
      : levelNumber === 2 ? SECOND_SPAWN_CELLS : SPAWN_CELLS;
  const shuffledSpawns = [...spawnSet]
    .filter(cell => (
      cell.r > 0 && cell.r < ROWS - 2 &&
      cell.c > 1 && cell.c < boardCols() - 2
    ))
    .sort(() => Math.random() - 0.5);
  blocks = blockSet.map((b, index) => ({
    ...b,
    r: shuffledSpawns[index].r,
    c: shuffledSpawns[index].c,
  }));
  player = { ...PLAYER_START };
  if (levelNumber === 2) player = { r: 7, c: 6 };
  if (levelNumber === 3) player = { r: 7, c: 6 };
  if (levelNumber === 5) player = { r: 7, c: 10 };

function startLevel(num) {
  levelNumber = num;
  levelScore = LEVEL_SCORES[num];

  pendingAction = null;

}

function restartLevel() {
  if (won) return;
  currentLevelRetries++;
  levelScore = Math.max(0, levelScore - 2);
  if (levelScore === 0) {
    gameOverModal();
    return;
  }
  loadLevel();
  sfxReset();

function showModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;

}

function closeModal() {
  ensureMusic();
  document.getElementById('modal').classList.add('hidden');

  pendingAction = null;
  if (action === 'next') {
    startLevel(levelNumber + 1);
  } else if (action === 'hidden-intro') {
    startSequenceGame();
  } else if (action === 'complete') {
    window.location.href = 'index.html';
  } else if (action === 'gameover') {
    totalScore = 0;
    totalMovesAllLevels = 0;
    levelDetailsLog = [];
    gameStartTime = Date.now();
    startLevel(1);
  }
}

function sequenceRandomTile() {
  return Math.floor(Math.random() * SEQUENCE_DYNASTIES.length);
}

function sequenceHasMatchAt(tiles, r, c) {
  const index = r * SEQUENCE_SIZE + c;
  const value = tiles[index];
  if (value == null) return false;
  return (
    c <= SEQUENCE_SIZE - 3 &&
    tiles[index + 1] === value + 1 &&
    tiles[index + 2] === value + 2
  ) || (
    r <= SEQUENCE_SIZE - 3 &&
    tiles[index + SEQUENCE_SIZE] === value + 1 &&
    tiles[index + SEQUENCE_SIZE * 2] === value + 2
  );
}

function sequenceFindMatches() {
  const matches = new Set();
  for (let r = 0; r < SEQUENCE_SIZE; r++) {
    for (let c = 0; c < SEQUENCE_SIZE; c++) {
      const index = r * SEQUENCE_SIZE + c;
      const value = sequenceTiles[index];
      if (value == null) continue;
      if (c <= SEQUENCE_SIZE - 3 && sequenceTiles[index + 1] === value + 1 && sequenceTiles[index + 2] === value + 2) {
        matches.add(index); matches.add(index + 1); matches.add(index + 2);
      }
      if (r <= SEQUENCE_SIZE - 3 && sequenceTiles[index + SEQUENCE_SIZE] === value + 1 && sequenceTiles[index + SEQUENCE_SIZE * 2] === value + 2) {
        matches.add(index); matches.add(index + SEQUENCE_SIZE); matches.add(index + SEQUENCE_SIZE * 2);
      }
    }
  }
  return matches;
}

function sequenceCreateBoard() {
  do {
    sequenceTiles = Array.from({ length: SEQUENCE_SIZE * SEQUENCE_SIZE }, sequenceRandomTile);
  } while (sequenceFindMatches().size > 0);
}

function renderSequenceBoard() {
  const board = document.getElementById('sequenceBoard');
  board.innerHTML = '';
  sequenceTiles.forEach((tile, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'sequence-tile';
    button.style.background = SEQUENCE_COLORS[tile];
    button.textContent = SEQUENCE_DYNASTIES[tile];
    button.setAttribute('aria-label', `${SEQUENCE_DYNASTIES[tile]}，第 ${index + 1} 格`);
    if (sequenceSelected === index) button.classList.add('selected');
    button.addEventListener('click', () => sequenceSelect(index));
    board.appendChild(button);
  });
}

function updateSequenceHud() {
  document.getElementById('sequenceTime').textContent = sequenceTimeLeft;
  document.getElementById('sequenceScore').textContent = sequenceScore;
  document.getElementById('sequenceCombo').textContent = sequenceCombo;
  document.getElementById('sequenceTime').classList.toggle('urgent', sequenceTimeLeft <= 5);
}

function sequenceAreAdjacent(a, b) {
  const ar = Math.floor(a / SEQUENCE_SIZE), ac = a % SEQUENCE_SIZE;
  const br = Math.floor(b / SEQUENCE_SIZE), bc = b % SEQUENCE_SIZE;
  return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
}

function sequenceSelect(index) {
  if (sequenceFinished || sequenceBusy) return;
  if (sequenceSelected === null) {
    sequenceSelected = index;
  } else if (sequenceSelected === index) {
    sequenceSelected = null;
  } else if (sequenceAreAdjacent(sequenceSelected, index)) {
    sequenceSwap(sequenceSelected, index);
    sequenceSelected = null;
  } else {
    sequenceSelected = index;
  }
  renderSequenceBoard();
}

function sequenceDropTiles() {
  for (let c = 0; c < SEQUENCE_SIZE; c++) {
    const remaining = [];
    for (let r = SEQUENCE_SIZE - 1; r >= 0; r--) {
      const tile = sequenceTiles[r * SEQUENCE_SIZE + c];
      if (tile != null) remaining.push(tile);
    }
    for (let r = SEQUENCE_SIZE - 1; r >= 0; r--) {
      sequenceTiles[r * SEQUENCE_SIZE + c] = remaining[SEQUENCE_SIZE - 1 - r] ?? sequenceRandomTile();
    }
  }
}

function sequenceResolveMatches() {
  const matches = sequenceFindMatches();
  if (!matches.size) {
    sequenceCombo = 0;
    return false;
  }
  sequenceCombo++;
  sequenceScore += matches.size * 10 + sequenceCombo * 10;
  matches.forEach(index => { sequenceTiles[index] = null; });
  sequenceDropTiles();
  updateSequenceHud();
  return true;
}

function sequenceSwap(a, b) {
  if (sequenceBusy) return;
  sequenceBusy = true;
  [sequenceTiles[a], sequenceTiles[b]] = [sequenceTiles[b], sequenceTiles[a]];
  if (!sequenceResolveMatches()) {
    [sequenceTiles[a], sequenceTiles[b]] = [sequenceTiles[b], sequenceTiles[a]];
    sequenceCombo = 0;
    sequenceBusy = false;
    renderSequenceBoard();
    return;
  }
  sfxPlace();
  renderSequenceBoard();
  window.setTimeout(() => {
    while (sequenceResolveMatches()) renderSequenceBoard();
    sequenceBusy = false;
    renderSequenceBoard();
    if (sequenceScore >= SEQUENCE_REWARD_SCORE) {
      document.getElementById('sequenceResult').textContent = '已達到奶茶獎勵門檻！繼續挑戰更高分！';
    }
  }, 180);
}

function startSequenceGame() {
  hiddenLevelUnlocked = true;
  sequenceScore = 0;
  sequenceCombo = 0;
  sequenceTimeLeft = SEQUENCE_TIME_LIMIT;
  sequenceSelected = null;
  sequenceBusy = false;
  sequenceFinished = false;
  sequenceCreateBoard();
  document.body.classList.add('sequence-mode');
  document.getElementById('sequenceGame').classList.add('active');
  document.getElementById('subtitle').textContent = '隱藏關 · 30 秒朝代連號消消樂：挑戰 200 分奶茶獎勵';
  document.getElementById('sequenceResult').textContent = '';
  updateSequenceHud();
  renderSequenceBoard();
  sequenceTimer = window.setInterval(() => {
    sequenceTimeLeft = Math.max(0, sequenceTimeLeft - 1);

  }, 1000);
}

async function finishSequenceGame() {
  if (sequenceFinished) return;
  sequenceFinished = true;
  window.clearInterval(sequenceTimer);

  sequenceBusy = true;
  const rewardWon = sequenceScore >= SEQUENCE_REWARD_SCORE;

    level: 6,

    score: sequenceScore,

    combo: sequenceCombo,

function tryMove(dr, dc) {
  if (won) return;
  const nr = player.r + dr, nc = player.c + dc;
  if (isWallCell(nr, nc)) { sfxBlocked(); return; }
  const b = blockAt(nr, nc);
  if (b) {
    const br = b.r + dr, bc = b.c + dc;
    if (isWallCell(br, bc) || blockAt(br, bc)) { sfxBlocked(); return; }
    const wasOnTarget = isTarget(b, b.r, b.c);
    b.r = br; b.c = bc;
    sfxPush();
    if (!wasOnTarget && isTarget(b, b.r, b.c)) sfxPlace();
  } else {
    sfxStep();
  }
  player.r = nr; player.c = nc;
  moves++;
  checkWin();
  render();
  if (won) showWinEffects();
}

function showWinEffects() {
  document.querySelector('.door')?.classList.add('open');
  document.querySelectorAll('.block.done').forEach(block => block.classList.add('celebrate'));
  celebrate();
}

function render() {
  const board = document.getElementById('board');
  const columns = boardCols();
  board.classList.toggle('final-board', levelNumber === 5);
  board.style.setProperty('--cell-size', levelNumber === 5 ? '48px' : '64px');
  board.style.gridTemplateColumns = `repeat(${columns}, var(--cell-size))`;
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < columns; c++) {
      const div = document.createElement('div');
      const cell = level[r][c];
      if (cell === WALL) { div.className = 'cell wall'; }
      else if (typeof cell === 'object' && cell !== null) {
        div.className = cell.door ? `cell wall door${won ? ' open' : ''}` : 'cell hint';
        if (cell.hint) div.textContent = cell.hint;
        if (cell.span) {
          div.classList.add('wide-hint');
          div.style.gridColumn = `span ${cell.span}`;
          c += cell.span - 1;
        }
      } else {
        div.className = 'cell floor';
        const target = blocks.find(b => b.tr === r && b.tc === c);
        if (target) div.classList.add('target');
      }
      const b = blockAt(r, c);
      if (b) {
        div.className = 'cell ' + b.cls;
        if (isTarget(b, b.r, b.c)) div.classList.add('done');
        if (won && isTarget(b, b.r, b.c)) div.classList.add('celebrate');
        div.textContent = b.name;
      }
      if (player.r === r && player.c === c) {
        div.className = 'cell player'; div.textContent = '🤖';
      }
      board.appendChild(div);
    }
  }
  document.getElementById('moves').textContent = moves;
}

function celebrate() {
  const colors = ['#e0b46a', '#9d5945', '#7ec488', '#5b718b', '#eee9df'];
  const layer = document.getElementById('confetti');
  for (let i = 0; i < 42; i++) {
    const piece = document.createElement('i');
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = `${Math.random() * .55}s`;
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    layer.appendChild(piece);
  }
}

// ---- 排行榜彈窗 ----
async function openLeaderboardModal() {
  const modal = document.getElementById('leaderboardModal');
  const content = document.getElementById('lbContent');
  const title = document.getElementById('lbTitle');
  const classId = currentStudent && !currentStudent.isGuest ? currentStudent.classId : '';
  title.textContent = classId && classId !== '教師' ? `🏆 ${classId} 班 英雄榜` : '🏆 學習作業 榮譽榜';
  content.innerHTML = '<p style="color:#b9a98c; padding:20px;">載入即時榜單中...</p>';
  modal.classList.remove('hidden');

  const data = await CAI.getLeaderboard(classId === '教師' ? '' : classId);
  if (!data || !data.topList || data.topList.length === 0) {
    content.innerHTML = '<p style="color:#b9a98c; padding:20px;">目前尚無挑戰紀錄，快成為第一位通關者！</p>';
    return;
  }

  let html = `
    <table class="rank-table">
      <thead>
        <tr>
          <th>名次</th>
          <th>姓名</th>
          <th>座號</th>
          <th>得分</th>
          <th>步數</th>
        </tr>
      </thead>
      <tbody>
  `;
  data.topList.forEach(item => {
    let rankIcon = item.rank;
    if (item.rank === 1) rankIcon = '🥇 1';
    else if (item.rank === 2) rankIcon = '🥈 2';
    else if (item.rank === 3) rankIcon = '🥉 3';

    html += `
      <tr>
        <td>${rankIcon}</td>
        <td>${item.name}</td>
        <td>${item.seatNo || '-'}</td>
        <td style="color:#e0b46a; font-weight:bold;">${item.score}</td>
        <td>${item.moves} 步</td>
      </tr>
    `;
  });
  html += `</tbody></table>`;
  content.innerHTML = html;
}

function closeLeaderboardModal() {
  document.getElementById('leaderboardModal').classList.add('hidden');
}

// ---- 鍵盤事件監聽 ----
document.addEventListener('keydown', e => {
  if (hiddenLevelUnlocked) return;
  const keymap = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
    w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1],
    W: [-1, 0], S: [1, 0], A: [0, -1], D: [0, 1],
  };
  const mv = keymap[e.key];
  if (mv) { e.preventDefault(); ensureMusic(); tryMove(mv[0], mv[1]); }
});

// 進入頁面立即嘗試播放音樂
ensureMusic();

// 啟動第一關
startLevel(1);
</script>
